[project]
name = "groundwaterwatch-pipeline"
version = "0.1.0"
description = "Ingest NASA GRACE-FO data assimilation NetCDF and emit per-region JSON time series"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "xarray>=2024.10",
    "netcdf4>=1.7",
    "numpy>=2.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "regionmask>=0.12",
    "pyogrio>=0.9",
    # Reads UNL's operational float32 GeoTIFF (pipeline.operational). Chosen
    # over rasterio/rioxarray because the grid is a plain unprojected 0.25 deg
    # raster whose georeferencing we read from tags once and hard-code, so the
    # full GDAL stack would be a large dependency for a decode we can do here.
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"
